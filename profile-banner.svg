    <circle cx="1010" cy="135" r="5"/><circle cx="850" cy="218" r="5"/>
    <circle cx="1030" cy="180" r="5"/><circle cx="1095" cy="90" r="5"/>
    <circle cx="1105" cy="231" r="5"/>
